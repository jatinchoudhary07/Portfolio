[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"

[[headers]]
  for = "/Jatin.choudhary_resume.pdf"
  [headers.values]
    Content-Type = "application/pdf"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
